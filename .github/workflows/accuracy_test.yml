name: Test Regime Accuracy

on:
  workflow_run:
    workflows: ["Deep ML Nifty Regime Auto-Tuner"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-accuracy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Accuracy Tester
        run: python regime_accuracy_tester.py

      - name: Commit accuracy report
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add regime_accuracy_report.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update AI prediction accuracy report [skip ci]"
            git push
          fi
