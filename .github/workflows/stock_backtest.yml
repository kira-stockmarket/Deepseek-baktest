name: Stock Strategy Backtest

on:
  workflow_run:
    workflows: ["140-Node Sectoral Hive Mind"]
    types:
      - completed
  workflow_dispatch:

jobs:
  run-stock-backtest:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Execute Sector Backtest
        run: python backtest_sector_strategy.py
      - name: Commit Backtest Artifacts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_backtest_report.json sector_backtest_chart.png
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "Update backtest metrics and chart [skip ci]" && git push; fi
