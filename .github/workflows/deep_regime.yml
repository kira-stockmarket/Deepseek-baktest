name: Deep ML Nifty Regime Auto-Tuner

on:
  schedule:
    # Runs at 03:00 UTC (08:30 AM IST), Monday-Friday
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-deep-regime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU-Optimized Heavy ML Dependencies
        run: |
          python -m pip install --upgrade pip
          # Crucial step: Install CPU-only PyTorch to prevent memory crash on GitHub runners
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Auto-Tune and Train Neural Network
        run: python deep_regime_engine.py

      - name: Commit and push updated regime files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add current_regime.json regime_history.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Optimize PyTorch hyperparameters and update regime [skip ci]"
            git push
          fi
