name: 20-Node Stacking Ensemble

on:
  schedule:
    # Runs daily at 03:00 UTC (8:30 AM IST), Mon-Fri
    - cron: '0 3 * * 1-5' 
  workflow_dispatch:

jobs:
  matrix-workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # If one node fails (e.g., CatBoost timeout), the other 19 keep running
      matrix:
        model: [gru, xgboost, lightgbm, catboost, random_forest]
        timeframe: [5, 14, 21, 63]
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      - name: Train Matrix Node (${{ matrix.model }} - ${{ matrix.timeframe }}D)
        run: python matrix_worker.py --model ${{ matrix.model }} --lookback ${{ matrix.timeframe }}
        
      - name: Upload Node Prediction
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.model }}-${{ matrix.timeframe }}
          path: output/
          retention-days: 1 # Saves free GitHub storage

  meta-brain:
    needs: matrix-workers
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the JSON back to your repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      # Downloads all 20 node artifacts into the 'all_nodes' directory automatically
      - name: Download all matrix votes
        uses: actions/download-artifact@v4
        with: 
          path: all_nodes/
          
      - name: Run Meta-Ensemble Stacker
        run: python meta_ensemble.py
        
      - name: Commit Master Prediction
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add current_regime.json
          # Only commit if the JSON actually changed
          if git diff --staged --quiet; then
            echo "No state change. Skipping commit."
          else
            git commit -m "Update master ensemble prediction [skip ci]"
            git push
          fi
