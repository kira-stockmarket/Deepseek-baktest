name: Nifty Multi-Sector Scanner

on:
  workflow_run:
    workflows: ["140-Node Sectoral Hive Mind"]
    types:
      - completed
  workflow_dispatch: 

jobs:
  scan-stocks:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Multi-Sector Scanner
        run: python nse_sector_scanner.py
      - name: Commit Stock Signals
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_signals.json
          if git diff --staged --quiet; then echo "No change"; else git commit -m "Update sector signals [skip ci]" && git push; fi
